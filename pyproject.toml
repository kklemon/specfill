[project]
name = "specfill"
version = "0.1.2"
description = "Interactive TUI that interviews you about underspecified points in a project seed prompt and produces a refined prompt"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kristian Klemon", email = "kristian.klemon@softmax-ai.com" }]
keywords = ["llm", "tui", "prompt-engineering", "cli", "coding-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "pydantic-ai-slim[openai,anthropic,google]>=2.0",
    "pyperclip>=1.9",
    "keyring>=25",
    "tomli-w>=1.0",
    "pydantic-settings>=2.6",
]

[project.urls]
Repository = "https://github.com/kklemon/specfill"
Issues = "https://github.com/kklemon/specfill/issues"

[project.scripts]
specfill = "specfill.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
